<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#10151a">
<title>Bike share TO — e-bikes</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #10151a; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
</style>
</head>
<body>
<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">Live e-bike availability at the 8 nearest Bike Share Toronto stations, split into all-nearest and nearest-with-ebikes, auto-refreshing every 25 seconds</h2>
<style>
  #board-root {
    --board-bg: #10151a;
    --board-panel: #171e25;
    --board-line: #2a333c;
    --board-amber: #ffb200;
    --board-amber-dim: #7a5900;
    --board-green: #3ddc84;
    --board-red: #ff5c5c;
    --board-text: #d7dee4;
    --board-text-dim: #7c8894;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--board-bg);
    color: var(--board-text);
    border-radius: 0;
    padding: 1rem;
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    min-height: 100vh;
  }
  @media (min-width: 480px) {
    #board-root { border-radius: 14px; padding: 1.25rem; min-height: 0; margin: 1rem auto; }
  }
  #board-root .mono { font-family: 'Courier New', ui-monospace, Menlo, monospace; }
  #board-root .head-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 2px;
  }
  #board-root .title {
    font-size: 13.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--board-text);
  }
  @media (min-width: 480px) {
    #board-root .title { font-size: 15px; letter-spacing: 0.06em; }
  }
  #board-root .clock { font-size: 12px; color: var(--board-text-dim); }
  #board-root .sub { font-size: 12px; color: var(--board-text-dim); margin-bottom: 14px; }
  #board-root .nearest-btn {
    width: 100%;
    background: var(--board-panel);
    border: 1px solid var(--board-line);
    color: var(--board-text);
    font-size: 13px;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 16px;
    cursor: pointer;
  }
  #board-root .columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  #board-root .col-head {
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--board-text-dim);
    padding: 0 2px 8px;
    border-bottom: 1px solid var(--board-line);
    margin-bottom: 6px;
  }
  #board-root .col-head.ebike-col { color: var(--board-amber); }
  #board-root .stat-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 9px 2px;
    border-bottom: 1px solid var(--board-line);
  }
  #board-root .stat-row:last-child { border-bottom: none; }
  #board-root .stat-name {
    font-size: 11.5px;
    color: var(--board-text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
  }
  #board-root .dir-btn {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--board-amber-dim);
    color: var(--board-amber);
    border-radius: 5px;
    font-size: 11px;
    text-decoration: none;
    line-height: 1;
  }
  #board-root .dir-btn:active { background: var(--board-amber); color: #10151a; }
  @media (min-width: 480px) {
    #board-root .stat-name { font-size: 12.5px; }
  }
  #board-root .stat-num {
    font-size: 17px;
    font-weight: 700;
    flex-shrink: 0;
  }
  @media (min-width: 480px) {
    #board-root .stat-num { font-size: 19px; }
  }
  #board-root .stat-num.amber { color: var(--board-amber); }
  #board-root .stat-num.zero { color: var(--board-red); }
  #board-root .stat-num.dim { color: var(--board-text-dim); }
  #board-root .empty {
    text-align: center;
    padding: 24px 8px;
    color: var(--board-text-dim);
    font-size: 12px;
    grid-column: 1 / -1;
  }
  #board-root .footer {
    display: flex;
    justify-content: space-between;
    margin-top: 14px;
    font-size: 11px;
    color: var(--board-text-dim);
  }
  #board-root .status-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--board-green);
    margin-right: 5px;
  }
</style>

<div id="board-root">
  <div class="head-row">
    <span class="title">Bike share TO — e-bikes</span>
    <span class="clock mono" id="clock">--:--:--</span>
  </div>
  <div class="sub">8 nearest stations, split by e-bike availability.</div>

  <button id="nearest-btn" type="button" class="nearest-btn">📍 Refresh my location</button>

  <div class="columns" id="columns">
    <div class="col-head">Nearest</div>
    <div class="col-head ebike-col">Nearest w/ e-bike</div>
  </div>

  <div class="footer">
    <span><span class="status-dot" id="status-dot"></span><span id="status-text">connecting…</span></span>
    <span id="updated-text">—</span>
  </div>
</div>

<script>
(function() {
  var STATION_INFO_URL = 'https://tor.publicbikesystem.net/ube/gbfs/v1/en/station_information';
  var STATION_STATUS_URL = 'https://tor.publicbikesystem.net/ube/gbfs/v1/en/station_status';
  var LOC_KEY = 'ebike-board-location';
  var INFO_CACHE_KEY = 'ebike-board-station-info-cache';
  var INFO_MAX_AGE_MS = 1000 * 60 * 60 * 12;

  var stationsById = {};
  var userLoc = null;
  var lastStatusFetch = 0;

  var elColumns = document.getElementById('columns');
  var elClock = document.getElementById('clock');
  var elStatusDot = document.getElementById('status-dot');
  var elStatusText = document.getElementById('status-text');
  var elUpdatedText = document.getElementById('updated-text');
  var elNearestBtn = document.getElementById('nearest-btn');

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function distanceKm(lat1, lon1, lat2, lon2) {
    var R = 6371;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLon = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
      Math.sin(dLon / 2) * Math.sin(dLon / 2);
    var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
  }

  function saveLocation() {
    try { localStorage.setItem(LOC_KEY, JSON.stringify(userLoc)); } catch (e) {}
  }

  function loadLocation() {
    try {
      var raw = localStorage.getItem(LOC_KEY);
      userLoc = raw ? JSON.parse(raw) : null;
    } catch (e) { userLoc = null; }
  }

  function useMyLocation(cb) {
    if (!navigator.geolocation) {
      alert('Location isn\'t available in this browser.');
      return;
    }
    var originalLabel = elNearestBtn.textContent;
    elNearestBtn.textContent = 'Finding your location…';
    elNearestBtn.disabled = true;

    navigator.geolocation.getCurrentPosition(function(pos) {
      userLoc = { lat: pos.coords.latitude, lon: pos.coords.longitude };
      saveLocation();
      elNearestBtn.textContent = originalLabel;
      elNearestBtn.disabled = false;
      render();
      if (cb) cb();
    }, function(err) {
      elNearestBtn.textContent = originalLabel;
      elNearestBtn.disabled = false;
      alert('Couldn\'t get your location. Try again, or check Safari\'s location permission for this site.');
    }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
  }

  function tickClock() {
    var d = new Date();
    elClock.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    if (lastStatusFetch) {
      var secs = Math.round((Date.now() - lastStatusFetch) / 1000);
      elUpdatedText.textContent = 'updated ' + secs + 's ago';
    }
  }

  async function loadStationInfo() {
    var cached = null;
    try {
      var raw = localStorage.getItem(INFO_CACHE_KEY);
      if (raw) cached = JSON.parse(raw);
    } catch (e) {}

    if (cached && cached.fetchedAt && (Date.now() - cached.fetchedAt) < INFO_MAX_AGE_MS) {
      applyStationInfo(cached.stations);
      return;
    }

    try {
      var resp = await fetch(STATION_INFO_URL);
      var data = await resp.json();
      var stations = data.data.stations;
      applyStationInfo(stations);
      try {
        localStorage.setItem(INFO_CACHE_KEY, JSON.stringify({ fetchedAt: Date.now(), stations: stations }));
      } catch (e) {}
    } catch (e) {
      if (cached && cached.stations) applyStationInfo(cached.stations);
    }
  }

  function applyStationInfo(stations) {
    stationsById = {};
    for (var i = 0; i < stations.length; i++) {
      var s = stations[i];
      stationsById[s.station_id] = {
        id: s.station_id,
        name: s.name,
        lat: s.lat,
        lon: s.lon,
        ebikes: null
      };
    }
  }

  async function refreshStatus() {
    try {
      var resp = await fetch(STATION_STATUS_URL);
      var data = await resp.json();
      var list = data.data.stations;
      for (var i = 0; i < list.length; i++) {
        var s = list[i];
        var st = stationsById[s.station_id];
        if (!st) continue;
        var types = s.num_bikes_available_types || {};
        st.ebikes = typeof types.ebike === 'number' ? types.ebike : 0;
      }
      lastStatusFetch = Date.now();
      elStatusDot.style.background = 'var(--board-green)';
      elStatusText.textContent = 'live';
    } catch (e) {
      elStatusDot.style.background = 'var(--board-red)';
      elStatusText.textContent = 'connection issue, retrying';
    }
    render();
  }

  function sortedByDistance() {
    if (!userLoc) return [];
    var arr = [];
    for (var id in stationsById) {
      var s = stationsById[id];
      if (typeof s.lat === 'number' && typeof s.lon === 'number') {
        arr.push({ s: s, d: distanceKm(userLoc.lat, userLoc.lon, s.lat, s.lon) });
      }
    }
    arr.sort(function(a, b) { return a.d - b.d; });
    return arr.map(function(x) { return x.s; });
  }

  function abbreviateName(name) {
    var n = name;
    var repl = [
      [/\bStreet\b/gi, 'St'], [/\bAvenue\b/gi, 'Ave'], [/\bBoulevard\b/gi, 'Blvd'],
      [/\bDrive\b/gi, 'Dr'], [/\bRoad\b/gi, 'Rd'], [/\bPlace\b/gi, 'Pl'],
      [/\bCrescent\b/gi, 'Cres'], [/\bLane\b/gi, 'Ln'], [/\bCourt\b/gi, 'Ct'],
      [/\bCircle\b/gi, 'Cir'], [/\bSquare\b/gi, 'Sq'], [/\bTerrace\b/gi, 'Terr'],
      [/\bParkway\b/gi, 'Pkwy'], [/\bHighway\b/gi, 'Hwy'], [/\bGardens\b/gi, 'Gdns'],
      [/\bTrail\b/gi, 'Trl'], [/\bStation\b/gi, 'Stn'],
      [/\bNorth\b/gi, 'N'], [/\bSouth\b/gi, 'S'], [/\bEast\b/gi, 'E'], [/\bWest\b/gi, 'W']
    ];
    for (var i = 0; i < repl.length; i++) n = n.replace(repl[i][0], repl[i][1]);
    n = n.replace(/\s+/g, ' ').trim();
    if (n.length > 22) {
      var slash = n.indexOf(' / ');
      if (slash > 0 && slash < 22) n = n.slice(0, slash);
      else n = n.slice(0, 21) + '…';
    }
    return n;
  }

  function statRow(station, showDirections) {
    var row = document.createElement('div');
    row.className = 'stat-row';

    var name = document.createElement('div');
    name.className = 'stat-name';
    name.textContent = abbreviateName(station.name);
    name.title = station.name;
    row.appendChild(name);

    if (showDirections) {
      var dirBtn = document.createElement('a');
      dirBtn.className = 'dir-btn';
      dirBtn.href = 'https://maps.apple.com/?daddr=' + station.lat + ',' + station.lon +
        '&q=' + encodeURIComponent(station.name);
      dirBtn.target = '_blank';
      dirBtn.rel = 'noopener';
      dirBtn.setAttribute('aria-label', 'Directions to ' + station.name);
      dirBtn.textContent = '➜';
      row.appendChild(dirBtn);
    }

    var num = document.createElement('div');
    var v = (station.ebikes === null || station.ebikes === undefined) ? '--' : station.ebikes;
    var cls = 'stat-num mono';
    if (v === '--') cls += ' dim';
    else if (v === 0) cls += ' zero';
    else cls += ' amber';
    num.className = cls;
    num.textContent = v;
    row.appendChild(num);

    return row;
  }

  function render() {
    elColumns.innerHTML =
      '<div class="col-head">Nearest</div>' +
      '<div class="col-head ebike-col">Nearest w/ e-bike</div>';

    if (!userLoc) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'Tap "Refresh my location" above to find your nearest stations.';
      elColumns.appendChild(empty);
      return;
    }

    var byDistance = sortedByDistance();
    var nearest8 = byDistance.slice(0, 8);
    var nearestWithEbikes8 = byDistance.filter(function(s) {
      return typeof s.ebikes === 'number' && s.ebikes > 0;
    }).slice(0, 8);

    var colA = document.createElement('div');
    var colB = document.createElement('div');

    if (nearest8.length === 0) {
      colA.innerHTML = '<div class="empty">No data</div>';
    } else {
      nearest8.forEach(function(s) { colA.appendChild(statRow(s, false)); });
    }

    if (nearestWithEbikes8.length === 0) {
      colB.innerHTML = '<div class="empty">None nearby</div>';
    } else {
      nearestWithEbikes8.forEach(function(s) { colB.appendChild(statRow(s, true)); });
    }

    elColumns.appendChild(colA);
    elColumns.appendChild(colB);
  }

  elNearestBtn.addEventListener('click', function() { useMyLocation(); });

  async function init() {
    loadLocation();
    await loadStationInfo();
    render();
    await refreshStatus();
    if (!userLoc) useMyLocation();
    setInterval(refreshStatus, 25000);
    setInterval(tickClock, 1000);
    tickClock();
  }

  init();
})();
</script>
</body>
</html>
